name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Node 20 deprecated (GitHub runner Node 24'e zorluyor); 22 + 24 aktif destek.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # No dependencies (runtime dependency-free); npm ci is not needed.
      - run: npm test
      - run: npm run lint
      # On Node 22 --experimental-strip-types reports SKIP (detected in the script); it fully runs on 24.
      - run: npm run test:typecheck

  verify:
    name: Verify (release gate + benchmarks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run verify
      # Note: bench:regression (baseline drift) does NOT run in CI — the baseline is produced on local
      # hardware, so a GitHub runner's different CPU/timing gives flaky results.
      # The drift gate is meaningful in local development; the CI gate is verify (25 benchmarks).

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 24: --experimental-test-coverage depends on Node 22.13+ patches; it is stable on 24.
          node-version: 24
      - run: npm run test:coverage
        continue-on-error: false

  preview-e2e:
    name: Preview e2e (loopback server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node test/e2e/preview-e2e.mjs
